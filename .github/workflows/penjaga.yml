# Setiap pull request dan push diperiksa penjaga falsafah, rakit, dan uji paket React.
name: Penjaga
on: [push, pull_request]
permissions:
  contents: read
jobs:
  penjaga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run rakit
      - run: npm run uji
