# Cloudflare Tunnel (ruas.metabahri.com) -> nginx 127.0.0.1:3023 -> berkas statis /opt/ruas.
# Hanya site/, dist/, docs/, icons/ yang disajikan; node_modules, scripts, .git tidak.
# Pasang: sudo cp deploy/nginx-ruas.conf /etc/nginx/sites-available/ruas.conf && sudo nginx -t && sudo systemctl reload nginx
# Perbarui isi: cd /opt/ruas && git pull && npm ci && npm run rakit
server {
    listen 127.0.0.1:3023;
    server_name ruas.metabahri.com;
    root /opt/ruas;
    absolute_redirect off; # di balik tunnel: jangan bocorkan port 3023 di Location
    location = / { return 302 /site/; }
    location = /robots.txt { alias /opt/ruas/site/robots.txt; }
    location = /sitemap.xml { alias /opt/ruas/dist/sitemap.xml; }
    location ~ ^/(site|dist|docs|icons)/ {
        index index.html;
        try_files $uri $uri/ =404;
        # Selalu tanya ulang (304 bila sama): ikon baru langsung tampil setelah rakit, tanpa menunggu cache kedaluwarsa.
        add_header Cache-Control "no-cache" always;
    }
    location / { return 404; }
}
