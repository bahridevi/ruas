# Cloudflare Tunnel (ruas.metabahri.com) -> nginx 127.0.0.1:3023 -> berkas statis /opt/ruas.
# Hanya site/, dist/, docs/, icons/ yang disajikan; node_modules, scripts, .git tidak.
# Pasang: sudo cp deploy/nginx-ruas.conf /etc/nginx/sites-available/ruas.conf && sudo nginx -t && sudo systemctl reload nginx
# Perbarui isi: cd /opt/ruas && git pull && npm ci && npm run rakit
# Statistik: log sendiri (IP asli dari Cloudflare) dibaca scripts/statistik.mjs lewat cron -> /var/lib/ruas-stat.
log_format ruas '$time_iso8601\t$http_cf_connecting_ip\t$http_cf_ipcountry\t$request_method\t$request_uri\t$status\t$http_referer\t$http_user_agent';

server {
    listen 127.0.0.1:3023;
    server_name ruas.metabahri.com;
    root /opt/ruas;
    absolute_redirect off; # di balik tunnel: jangan bocorkan port 3023 di Location
    access_log /var/log/nginx/ruas.log ruas;
    location = / { return 302 /site/; }
    location = /robots.txt { alias /opt/ruas/site/robots.txt; }
    location = /sitemap.xml { alias /opt/ruas/dist/sitemap.xml; }
    location ~ ^/(site|dist|docs|icons)/ {
        index index.html;
        try_files $uri $uri/ =404;
        # Selalu tanya ulang (304 bila sama): ikon baru langsung tampil setelah rakit, tanpa menunggu cache kedaluwarsa.
        add_header Cache-Control "no-cache" always;
    }
    # Galeri mengirim penanda saat SVG/komponen/sprite/tautan disalin (tanpa cookie); cukup tercatat di log.
    location = /stat/hit { return 204; }
    # Angka umum untuk semua orang: dilihat & diunduh
    location = /stat/umum.json {
        alias /var/lib/ruas-stat/umum.json;
        add_header Cache-Control "no-cache" always;
    }
    # Rincian hanya untuk pemilik
    location ^~ /stat/privat/ {
        auth_basic "Statistik Ruas";
        auth_basic_user_file /etc/nginx/ruas-stat.htpasswd;
        alias /var/lib/ruas-stat/privat/;
        index index.html;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location / { return 404; }
}
